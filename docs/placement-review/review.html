 more pieces",body:["The camp shirt, coat-dress, fit-and-flare, gown, swing coat, capelet, cross-wrap top, clutch and apron had nowhere to put an accessory. They now have 32 positions between them, placed by eye on each finished piece.","- Camp shirt: collar (a bow there is a bow tie), and a chest pocket either side.","- Coat-dress: the collar point, either collar, three along the waist for a sash, obi or tulip, and a pocket on each hip.","- Fit-and-flare: neckline, chest and waist. Gown: the shoulder where the sash begins, and the empire waist.","- Swing coat: the closure, either lapel, a pocket on each hip. Capelet: the clasp.","- Cross-wrap top: where the fronts cross, and the waist. Clutch: a pin at the point of the flap. Apron: bib, waist, a pocket on each side.","Every accessory allowed at a position lies wholly on paper; the repository’s own footprint audit checks all 594 placements. A collar, shoulder or clasp takes only the pin, and a hip takes the pin or the pocket, so the wide bow is not offered there. Accessories are folded a little smaller for the gown, fit-and-flare and capelet, and larger for the apron.","The picture shows a few of them in the app. They are first placements: where a pin sits is yours to judge, and each is one line in src/fold/garments.ts."],image:{file:"accessories.jpg",alt:"Accessories placed on the nine pieces, photographed in the app"}},{group:vt,kind:"done",title:"A finished piece with an accessory no longer says it was kept aside",body:["On the newer designs the note under the toolbar ended with “accessory kept aside” whenever an accessory was attached, including on the kimono while its obi was showing. It now says so only when the piece has no place for that accessory."]},{group:Te,kind:"note",title:"Five motif papers start out of sight on a third of the wardrobe",body:["Plum scatter, Corner bloom, Ginkgo pairs, Reed study and Reverse garden each have a small motif on a plain ground. On 33 paper-and-piece pairs the piece keeps under 12% of the motif as drawn, while another turn or position keeps more than 40%.","Decided: curated papers begin from the suggestion. For Plum scatter that covers the kimono, wrap skirt, cross-wrap top, coat-dress, camp shirt, necktie, capelet and zori. It still starts plain on the lapel vest and swing coat, where I found no placement I would put my name to; the panel offers the measured ones.","The other four are experimental and begin as drawn, with better starts one press away."],shots:[{piece:"skirt",paper:"plum-scatter",label:"Wrap skirt as drawn"},{piece:"skirt",paper:"plum-scatter",turns:2,x:.296875,y:.296875,label:"Now begins here"},{piece:"coat-dress",paper:"plum-scatter",label:"Coat-dress as drawn"},{piece:"coat-dress",paper:"plum-scatter",x:-.296875,y:.2265625,label:"Now begins here"},{piece:"clutch",paper:"corner-bloom",label:"Clutch as drawn"},{piece:"clutch",paper:"corner-bloom",turns:2,y:.07421875,label:"Offered: Bloom on the flap"}]},{group:Te,kind:"note",title:"Border print wants half a turn on anything cut from the top of the square",body:["The wave band sits at the foot of the sheet. That is right for the dress, gown, pleated skirt, fit-and-flare and camp shirt, where it becomes a hem. Tops, outerwear and small pieces are made from the upper part of the square and never see it.","Two turns bring the band to the yoke, collar, sleeve hems, hatband, boot cuffs and the rim of the fan. Thirteen of the 27 suggestions are this one move, and Border print now begins that way on those pieces."],shots:[{piece:"jacket",paper:"border-print",label:"Box jacket as drawn"},{piece:"jacket",paper:"border-print",turns:2,label:"Waves across the yoke"},{piece:"coat-dress",paper:"border-print",label:"Coat-dress as drawn"},{piece:"coat-dress",paper:"border-print",turns:2,label:"Waves on the collar"},{piece:"sensu",paper:"border-print",label:"Fan as drawn"},{piece:"sensu",paper:"border-print",turns:2,label:"Waves along the rim"},{piece:"boot-left",paper:"border-print",turns:2,label:"Cuff band"}]},{group:Te,kind:"choice",title:"Thirteen of the seventeen curated papers have a plain reverse",body:["22 of the 40 visible papers have nothing drawn on the back. On most pieces that is fine: the reverse is a collar, a band or a lining. On the reverse colourways it is the whole piece. The reverse-colour gown shows 12% print, the reverse zori 9% and the reverse fan none, so with these papers they come out as one flat colour.","Papers with a drawn reverse, such as Pinstripe and lining, Plum seed and the three guest papers, make every colourway worth choosing. Options:","- Give the curated papers a quiet reverse: a tone-on-tone grain, a pin dot, a faint echo of the front. Drawings are frozen, so these would be new papers beside the old ones.","- Leave the papers and steer: when the reverse is plain, do not lead with the reverse colourway.","- Leave it. A flat colour can be what someone wants."],shots:[{piece:"gown:reverse",paper:"botanical",label:"Reverse gown, plain back"},{piece:"gown:reverse",paper:"pinstripe-lining",label:"Reverse gown, drawn back"},{piece:"sensu:reverse",paper:"indigo-lattice",label:"Reverse fan, plain back"},{piece:"sensu:reverse",paper:"plum-seed",label:"Reverse fan, drawn back"}]},{group:Te,kind:"choice",title:"Midnight orchard cannot reach the pieces that hide its branch",body:["It is one branch on a plain ground, like Plum scatter, but its placement is fixed. On the kimono it keeps 0 to 3% at every turn, and it is plain on the skirt, vest, wrap top and both coats.","Its reverse is a flat colour, so letting the print slide is a small change with nothing to register front to back. Reverse garden and Open stems are the same case with a little more work."],shots:[{piece:"dress",paper:"midnight-orchard",label:"Dress: lands well"},{piece:"kimono",paper:"midnight-orchard",label:"Kimono: any turn"},{piece:"coat-dress:print",paper:"midnight-orchard",label:"Printed coat-dress"}]},{group:Te,kind:"choice",title:"Two papers are the colour of the board",body:["The back of Open stems and the face of Oat linen are close to the cork and linen backgrounds. A reverse-colour piece in Open stems loses its outline on the board, and Oat linen relies on its shadow.","A slightly deeper or cooler tone would fix both, as new variants. Or treat it as a board matter and give the board a background that is not a paper colour."],shots:[{piece:"gown:reverse",paper:"open-stems",label:"Reverse gown, Open stems"},{piece:"zori:reverse",paper:"open-stems",label:"Reverse zori, Open stems"},{piece:"dress",paper:"oat-linen",label:"Dress, Oat linen"}]},{group:Te,kind:"note",title:"The fan re-cuts every print, and nothing is drawn for it",body:["Each pleat tucks a wedge away, so stripes break and motifs scatter. Small all-over repeats survive; Twice folded works because its dips sit on the centre line.","Sunray pleats is drawn on the dress’s own creases and misses the fan’s ribs at every turn. A fan paper whose rays start at the rivet is the obvious companion. I would hold it until the loop work is done."],shots:[{piece:"sensu",paper:"stripe-disc",label:"Stripe and disc"},{piece:"sensu",paper:"sunray-pleats",label:"Sunray pleats"},{piece:"sensu",paper:"twice-folded",turns:2,label:"Twice folded, two turns"},{piece:"sensu",paper:"polka-dot",label:"Polka dot"}]},{group:Te,kind:"note",title:"The kimono’s collar runs across the grain",body:["The collar strip comes from paper turned a quarter against the sleeves. With a striped or directional paper the collar reads as a ladder. One turn straightens the collar and lays the sleeves sideways. It belongs to the traditional fold and is not a fault; it is a reason to show the four turns as pictures."],shots:[{piece:"kimono:reverse",paper:"pinstripe-lining",label:"Reverse kimono as drawn"},{piece:"kimono:reverse",paper:"pinstripe-lining",turns:1,label:"One turn"},{piece:"kimono",paper:"sardine-run",label:"Sardine run as drawn"},{piece:"kimono",paper:"sardine-run",turns:1,label:"One turn"}]},{group:kt,kind:"choice",title:"Trousers, by not separating the legs",body:["There are no trousers in the wardrobe. The Refolds tab has a sketch: two leg panels that meet under a waistband of the other colour and part toward the hem over the backing. Five simple folds. It is wide and flared, closest to hakama, which goes with the kimono, zori and fan you already have.","It is the one new piece I would add before anything else, and the one I would most like a second opinion on: the centre of the waistband is thick."]},{group:kt,kind:"choice",title:"Three refolds are sketched; two I would take",body:["Folded hat, Boat-neck top, Bib apron, One-shoulder tunic and both ankle boots have no part that says what they are once the paper is plain. The Refolds tab has a candidate for three of them, each beside the fold it would replace.","- Ankle boot with a cuff: one fold added at the start. A clear improvement to look at, and it removes a 0.3 mm sliver the current boot has. It is two layers thicker at one hinge than the simple folds are allowed to be, which someone should weigh.","- Boat-neck top with short sleeves: the side flaps folded back out from the shoulder, as the dress does. It reads as a top.","- Hat with a band: better than the trapezoid, and still the weakest.","They are sketches outside the app. Changing an existing fold would break every baseline that holds it exact, so the way in is a choice on the old design (Cuff: plain or turned down) with the old fold as the default until you flip it.","Apron: I tried waist ties and could not get a neat one from simple folds. Pockets and a waistband do more for it, so it has accessory positions instead. Tunic: the gown does the same idea better; I would park it."],shots:[{piece:"hat",paper:"slate-grain",label:"Folded hat"},{piece:"boat-top",paper:"slate-grain",label:"Boat-neck top"},{piece:"apron",paper:"slate-grain",label:"Bib apron"},{piece:"tunic",paper:"slate-grain",label:"One-shoulder tunic"},{piece:"boot-left",paper:"slate-grain",label:"Ankle boot"}]},{group:kt,kind:"choice",title:"The pleated skirt hides its pleats at the classic depth",body:["From the front the Classic depth is a flat panel with a strip of reverse at each side. The Sardine run guest piece uses the Deep choice. Consider making Deep the default, or drawing the pleat edges the way the vest’s lapel edges are drawn."],shots:[{piece:"pleats",paper:"sardine-run",turns:1,label:"Classic depth"},{piece:"pleats",paper:"slate-grain",label:"Classic depth"}]},{group:kt,kind:"note",title:"Five pieces will be hard to fold at their suggested sizes",body:["From the repository’s own fold metrics (npm run fold-metrics), at the suggested starting squares:","- Folded necktie: 21 layers of paper at one point, from a 7 cm square.","- Zori: 16 layers from 8 cm. Folding fan: facets about 1.5 mm wide from 7.5 cm.","- Gown and fit-and-flare: a crease under 0.3 mm long. Ankle boots: a facet 0.3 mm wide.","None of this shows on screen. For a first try in real paper, fold these from 15 cm or larger and treat the suggested sizes as board sizes only. The kimono, dress and coat-dress are still the three I would fold first."]},{group:Pa,kind:"choice",title:"One accessory at a time is the limit that matters now",body:["A piece can wear one accessory. With positions on the coat-dress and camp shirt, the first thing you want is two: a pin on the collar and an obi at the waist, or a pocket and a bow tie. Letting a piece keep one accessory per position would do more for dressing up than any new accessory.","Smaller things I noticed while placing them:","- The folded sash is small everywhere. At a waist it reads as a buckle. It wants to be a length that follows the garment’s width, or a second, longer sash.","- The obi is the best waist accessory on the gown, fit-and-flare and cross-wrap top, where it spans the piece. On the coat-dress and apron it covers half the waist.","- The patch pocket is tiny on the coats. A hip pocket could be half as large again.","- Obvious gaps: a belt with a buckle, a flower for a lapel, a hatband for the hat. I would add none of them before a piece can wear two."]},{group:Pa,kind:"choice",title:"The pinboard: what I would change first",body:["You said the board is how you remember what you made. That is its real job, and it is not built for it yet. In the order I would do them:","- New pins land on top of the last one. Five pieces pinned are a pile showing two. A new pin should land in the nearest free space.","- A pinned piece does not show its recipe. Each already stores its design, paper, turn, print position, choices and square size. Show that as a caption when it is selected, and add “Open this piece again” so the workshop returns to exactly that state. This is the memory you were missing.","- A materials line under the photograph: “Kimono, 20 cm, Twice folded, two turns · Fan, 7.5 cm, same paper”. It turns a board into a folding plan, and it is the bridge to real paper.","- More than one board, each with a name. A board is a look; several are a lookbook. This is also where the briefs from the first review would be kept.","- Arranging is done with eight buttons. Dragging already works; a rotate handle on the selected piece and a Tidy button would replace most of the column.","- The shadow is as large as the piece and hides what is under it. Half the length and a softer edge would let overlaps read.","- Two papers are close to the board’s colours (see above). A board background that is not a paper colour would fix that for every future paper.","I changed none of this. The board has the most frozen checks in the repository, and I could not run them here."]}],fs={dress:{tier:"Anchor",note:"Reads at once. Collar and sleeves show the reverse; choices and all seven accessories."},jacket:{tier:"Solid",note:"Clear, if boxy. The reverse shows only at collar and cuffs, so it suits a strong print."},skirt:{tier:"Solid",note:"The wrap flap gives it away. Nearly half the front is reverse, so the reverse matters here."},vest:{tier:"Anchor",note:"Lapels and placket read well. Most motif papers miss the narrow fronts as drawn."},pleats:{tier:"Solid",note:"A clean skirt, but the pleats do not show at Classic depth. See Findings."},clutch:{tier:"Anchor",note:"An envelope is an envelope. Shown on the diagonal, so stripes always run corner to corner. A pin at the flap point is its clasp."},apron:{tier:"Look again",note:"The bib is almost as wide as the skirt, so it reads as a house. Pockets and a waistband help; it now takes both."},tunic:{tier:"Look again",note:"A wedge with one cut corner. The gown does this better."},tabard:{tier:"Solid",note:"A plain shield that shows a print whole. Useful as a canvas more than as a garment."},"boat-top":{tier:"Look again",note:"A band over a taper, with no shoulders. Reads as a bucket. See the sketch with short sleeves under Refolds."},"wrap-top":{tier:"Solid",note:"The crossed fronts read well and turn stripes on the diagonal. A pin where they cross, or an obi, suits it."},hat:{tier:"Look again",note:"A trapezoid with a line. Shows no reverse at all. See the banded sketch under Refolds."},kimono:{tier:"Anchor",note:"The most recognisable piece. Keeps only two small parts of the printed face, so placement matters most here."},gown:{tier:"Anchor",note:"Elegant, and the sash is a good use of the reverse. A crease under 0.3 mm at 20 cm. Now takes a pin at the shoulder and an obi or tulip at the waist."},"coat-dress":{tier:"Anchor",note:"The strongest silhouette in the set, and it shows both faces of the paper in either colourway. Now has eight accessory positions."},"swing-coat":{tier:"Solid",note:"Reads as a coat. Shows 39% print, the least of any garment, so it is a reverse-led piece. Now takes a clasp, lapel pins and hip pockets."},"fit-flare":{tier:"Anchor",note:"The waist does a lot of work. A crease under 0.3 mm at 20 cm. Now takes accessories at neckline, chest and waist."},"camp-shirt":{tier:"Anchor",note:"Collar, placket and cuffs all read. Fourteen steps. Now takes a chest pocket, and a bow at the collar is a bow tie."},necktie:{tier:"Anchor",note:"Shown on the diagonal, so any stripe is a regimental stripe. 21 layers at 7 cm."},capelet:{tier:"Solid",note:"Reads once you know. The two fronts take a motif well, and a pin at the neck is its clasp."},"boot-left":{tier:"Look again",note:"An L with a slanted toe. No reverse, no cuff, no heel. See the cuffed sketch under Refolds."},"boot-right":{tier:"Look again",note:"As the left boot."},zori:{tier:"Anchor",note:"The thong in the other colour makes it. 16 layers at 8 cm."},sensu:{tier:"Anchor",note:"Unmistakable, and hard on prints. See Findings."},"framed-brooch":{tier:"Anchor",note:"A small window that frames whatever you slide under it. The best partner for a motif paper."},"mitten-left":{tier:"Solid",note:"Reads as a mitten. The thumb sits at the wrist, as the notes already say."},"mitten-right":{tier:"Solid",note:"As the left mitten."}},Ca={"stripe-disc":"The default. The disc is the thing to place: it lands low on the dress and gown, and on the kimono only two turns bring it to a sleeve.","plum-scatter":"One blossom and a trail. Lost as drawn on nine pieces; the found placements recover all of them.","border-print":"A hem as drawn. Two turns make it a yoke, collar, cuff or rim. See Findings.",botanical:"An even scatter that survives every fold. Plain reverse.","ivory-border":"A fine frame that becomes trim. Turning it changes almost nothing.","oat-linen":"Close to the board’s colour. See Findings.","reed-study":"A few scattered stems. Most pieces keep under half of them as drawn; sliding helps a great deal.","arc-study":"Large rings that every fold crops. Bold on big pieces, noise on small ones.","ginkgo-pairs":"Small paired leaves. Lost as drawn on five pieces.","corner-bloom":"One flower in a corner. Lost as drawn on eight pieces; the easiest paper to place with the new panel.","midnight-orchard":"One branch,
